<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New message</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #1c1c1c;">
    <h1 style="color: #4b52a7; margin-bottom: 16px;">
        New message from <span th:text="${senderName}">Maya</span>
    </h1>
    <blockquote style="border-left: 3px solid #4b52a7; margin: 16px 0; padding: 12px 16px; color: #444; background:#f7f7fb; border-radius:0 8px 8px 0;">
        <p style="margin:0; white-space:pre-wrap;" th:text="${contentPreview}">Hi! Quick question about the projector...</p>
    </blockquote>
    <p style="margin-top: 24px;">
        <a th:href="${conversationUrl}" style="background:#4b52a7;color:#fff;padding:10px 20px;text-decoration:none;border-radius:6px;display:inline-block;">
            Reply
        </a>
    </p>
    <p style="color:#888;font-size:12px;margin-top:32px;border-top:1px solid #eee;padding-top:16px;">
        You're receiving this because email-on-new-message is enabled in your Reservity preferences.
        Manage notifications in your account settings.
    </p>
</body>
</html>
